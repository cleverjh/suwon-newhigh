name: 수원 신고가 갱신·아파트너 게시

on:
  schedule:
    # 매주 월·목 08:30 KST (= 일·수 23:30 UTC)
    - cron: '30 23 * * 0,3'
  workflow_dispatch:
    inputs:
      backfill:
        description: '[backfill] 과거 데이터 백필 — 최초 1회만, 20~30분 소요'
        type: boolean
        default: false
      reset:
        description: '[reset] 백필 전 최고가 DB 초기화 (backfill과 함께 체크, DB 재구축용)'
        type: boolean
        default: false
      post:
        description: '[post] 아파트너 게시 실행 (해제하면 데이터 갱신만)'
        type: boolean
        default: true
      dry_run:
        description: '[dry_run] 게시 리허설 — 데이터는 그대로 두고 등록 직전까지만 진행'
        type: boolean
        default: false
      force_post:
        description: '[force_post] 지금 리포트를 그대로 게시 — 새 신고가 탐지 없이 실제 등록'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      APTNER_ID: ${{ secrets.APTNER_ID }}
      APTNER_PW: ${{ secrets.APTNER_PW }}
      APTNER_WRITE_URL: ${{ secrets.APTNER_WRITE_URL }}
    steps:
      - name: 실행 옵션 요약
        run: |
          {
            echo "### 이번 실행 옵션"
            echo ""
            echo "| 옵션 | 값 | 실행 여부 |"
            echo "|---|---|---|"
            echo "| backfill (과거 데이터 백필) | \`${{ inputs.backfill }}\` | ${{ inputs.backfill == true && '✅ 실행' || '⏭️ 건너뜀' }} |"
            echo "| reset (최고가 DB 초기화) | \`${{ inputs.reset }}\` | ${{ (inputs.backfill == true && inputs.reset == true) && '✅ 실행' || '⏭️ 건너뜀' }} |"
            echo "| post (아파트너 게시) | \`${{ inputs.post }}\` | ${{ (github.event_name != 'workflow_dispatch' || inputs.post != false) && '조건부' || '⏭️ 건너뜀' }} |"
            echo "| dry_run (등록 직전까지) | \`${{ inputs.dry_run }}\` | ${{ inputs.dry_run == true && '✅ 적용' || '- ' }} |"
            echo "| force_post (현재 리포트 그대로 게시) | \`${{ inputs.force_post }}\` | ${{ inputs.force_post == true && '✅ 실제 등록' || '- ' }} |"
            echo ""
            if [ "${{ inputs.backfill }}" != "true" ]; then
              echo "> 백필을 돌리려면 Run workflow에서 **[backfill]** 체크박스를 켜야 합니다. (DB 재구축은 **[reset]**도 함께)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── 최초 1회: 과거 실거래 전체 백필 ──────────────────────────
      - name: 최고가 DB 초기화
        if: inputs.backfill == true && inputs.reset == true
        run: |
          rm -f data/max-prices.json data/backfill-state.json data/announced.json
          echo "최고가 DB·진행상태·게시이력을 초기화했습니다. (우리 아파트 거래 이력은 유지)"

      - name: 과거 데이터 백필
        if: inputs.backfill == true
        id: backfill
        continue-on-error: true   # 중단되어도 진행분을 커밋해야 다음 실행에서 이어갈 수 있음
        run: node scripts/backfill.js

      # ── 정기: 최근 데이터 조회 + 신고가 탐지 + 리포트 생성 ──────
      - name: 신고가 데이터 갱신
        if: inputs.backfill != true && inputs.dry_run != true && inputs.force_post != true
        id: update
        run: node scripts/update.js

      - name: 데이터 변경사항 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 신고가 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
            # 실행 중에 main이 앞서 나갔을 수 있으므로 리베이스 후 푸시 (최대 3회 재시도).
            # 백필은 15분 넘게 걸리므로, 한 번의 푸시 거부로 결과를 잃지 않도록 한다.
            for i in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "푸시 성공 (시도 $i)"
                exit 0
              fi
              echo "푸시 실패, 재시도 $i/3"
              sleep 5
            done
            echo "::error::데이터 푸시에 실패했습니다. 아티팩트(data-backup)에서 복구하세요."
            exit 1
          fi

      # ── 새 신고가가 있을 때만 게시글 생성 후 아파트너 게시 ───────
      - name: 게시글 생성
        if: (steps.update.outputs.should_post == 'true' || inputs.dry_run == true || inputs.force_post == true) && (github.event_name != 'workflow_dispatch' || inputs.post != false)
        run: node scripts/make-post.js

      - name: Playwright 설치
        if: (steps.update.outputs.should_post == 'true' || inputs.dry_run == true || inputs.force_post == true) && (github.event_name != 'workflow_dispatch' || inputs.post != false)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 이미지 카드 생성
        if: (steps.update.outputs.should_post == 'true' || inputs.dry_run == true || inputs.force_post == true) && (github.event_name != 'workflow_dispatch' || inputs.post != false)
        run: node scripts/render-image.js

      - name: 아파트너 게시
        if: (steps.update.outputs.should_post == 'true' || inputs.dry_run == true || inputs.force_post == true) && (github.event_name != 'workflow_dispatch' || inputs.post != false) && env.APTNER_ID != ''
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/post-aptner.js

      - name: 백필 미완료 알림
        if: inputs.backfill == true && steps.backfill.outcome == 'failure'
        run: |
          {
            echo ""
            echo "### ⚠️ 백필이 끝까지 진행되지 못했습니다"
            echo ""
            echo "여기까지의 진행 상황은 저장·커밋되었습니다."
            echo "**[backfill]만 체크하고 [reset]은 체크하지 말고** 다시 실행하면 남은 구간부터 이어서 진행합니다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::백필 미완료 — [reset] 없이 [backfill]만 체크해 다시 실행하세요."
          exit 1

      # 푸시가 실패해도 수집한 데이터를 잃지 않도록 항상 백업해 둔다
      - name: 데이터 백업 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-backup
          path: |
            data/
            docs/data/
          if-no-files-found: ignore
          retention-days: 14

      - name: 결과물 업로드 (게시글·스크린샷)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-output
          path: out/
          if-no-files-found: ignore
          retention-days: 14
