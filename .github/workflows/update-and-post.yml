name: 수원 신고가 갱신·아파트너 게시

on:
  schedule:
    # 매주 월·목 08:30 KST (= 일·수 23:30 UTC)
    - cron: '30 23 * * 0,3'
  workflow_dispatch:
    inputs:
      backfill:
        description: '[backfill] 과거 데이터 백필 — 최초 1회만, 20~30분 소요'
        type: boolean
        default: false
      reset:
        description: '[reset] 백필 전 최고가 DB 초기화 (backfill과 함께 체크, DB 재구축용)'
        type: boolean
        default: false
      post:
        description: '[post] 아파트너 게시 실행 (해제하면 데이터 갱신만)'
        type: boolean
        default: true
      dry_run:
        description: '[dry_run] 등록 버튼 누르기 직전까지만 — 미리보기·스크린샷 확인용'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      APTNER_ID: ${{ secrets.APTNER_ID }}
      APTNER_PW: ${{ secrets.APTNER_PW }}
      APTNER_WRITE_URL: ${{ secrets.APTNER_WRITE_URL }}
    steps:
      - name: 실행 옵션 요약
        run: |
          {
            echo "### 이번 실행 옵션"
            echo ""
            echo "| 옵션 | 값 | 실행 여부 |"
            echo "|---|---|---|"
            echo "| backfill (과거 데이터 백필) | \`${{ inputs.backfill }}\` | ${{ inputs.backfill == true && '✅ 실행' || '⏭️ 건너뜀' }} |"
            echo "| reset (최고가 DB 초기화) | \`${{ inputs.reset }}\` | ${{ (inputs.backfill == true && inputs.reset == true) && '✅ 실행' || '⏭️ 건너뜀' }} |"
            echo "| post (아파트너 게시) | \`${{ inputs.post }}\` | ${{ inputs.post != false && '조건부' || '⏭️ 건너뜀' }} |"
            echo "| dry_run (등록 직전까지) | \`${{ inputs.dry_run }}\` | ${{ inputs.dry_run == true && '✅ 적용' || '- ' }} |"
            echo ""
            if [ "${{ inputs.backfill }}" != "true" ]; then
              echo "> 백필을 돌리려면 Run workflow에서 **[backfill]** 체크박스를 켜야 합니다. (DB 재구축은 **[reset]**도 함께)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── 최초 1회: 과거 실거래 전체 백필 ──────────────────────────
      - name: 최고가 DB 초기화
        if: inputs.backfill == true && inputs.reset == true
        run: |
          rm -f data/max-prices.json data/backfill-state.json data/announced.json
          echo "최고가 DB·진행상태·게시이력을 초기화했습니다. (우리 아파트 거래 이력은 유지)"

      - name: 과거 데이터 백필
        if: inputs.backfill == true
        run: node scripts/backfill.js

      # ── 정기: 최근 데이터 조회 + 신고가 탐지 + 리포트 생성 ──────
      - name: 신고가 데이터 갱신
        if: inputs.backfill != true
        id: update
        run: node scripts/update.js

      - name: 데이터 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 신고가 데이터 갱신 ($(TZ=Asia/Seoul date +%F))"
            git push
          fi

      # ── 새 신고가가 있을 때만 게시글 생성 후 아파트너 게시 ───────
      - name: 게시글 생성
        if: steps.update.outputs.should_post == 'true' && inputs.post != false
        run: node scripts/make-post.js

      - name: Playwright 설치
        if: steps.update.outputs.should_post == 'true' && inputs.post != false
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 이미지 카드 생성
        if: steps.update.outputs.should_post == 'true' && inputs.post != false
        run: node scripts/render-image.js

      - name: 아파트너 게시
        if: steps.update.outputs.should_post == 'true' && inputs.post != false && env.APTNER_ID != ''
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/post-aptner.js

      - name: 결과물 업로드 (게시글·스크린샷)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-output
          path: out/
          if-no-files-found: ignore
          retention-days: 14
