<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수원SK스카이뷰 신고가 브리핑</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128293;</text></svg>">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header class="header">
        <p class="header-sub">국토부 실거래가 기준</p>
        <h1 class="header-title">
            <span id="titleApt" class="title-apt">수원SK스카이뷰</span>
            <span class="title-main">신고가 브리핑</span>
        </h1>
        <div class="header-row">
            <span id="ourAptBadge" class="city-badge">장안구 정자동</span>
            <span id="dateBadge" class="total-badge"></span>
        </div>
    </header>

    <!-- ① 우리 아파트 -->
    <section class="board our-apt">
        <div class="board-title">
            <span class="pin">🏠</span>
            <strong>우리 아파트</strong>
            <span id="ourAptName" class="count-chip">-</span>
        </div>
        <div id="ourAptBody">
            <p class="loading">데이터를 불러오는 중...</p>
        </div>
    </section>

    <!-- ② 인근 단지 신고가 -->
    <section class="board">
        <div class="board-title">
            <span class="pin">🏘️</span>
            <strong>인근 단지 신고가</strong>
            <span id="neighborUmd" class="count-chip">-</span>
        </div>
        <div id="neighborBody">
            <p class="loading">데이터를 불러오는 중...</p>
        </div>
    </section>

    <!-- ③ 오늘의 신고가 -->
    <section class="board">
        <div class="board-title">
            <span class="pin">🔥</span>
            <strong>오늘의 신고가</strong>
            <span id="countChip" class="count-chip">-건</span>
            <span id="dateChip" class="date-chip"></span>
        </div>

        <div id="content">
            <p class="loading">데이터를 불러오는 중...</p>
        </div>

        <footer class="notes">
            <p><strong class="notes-label">신고가 기준</strong> 같은 단지 · 전용면적형(㎡ 정수 기준)별 역대 최고 거래</p>
            <p>(신규)로 표시된 거래는 해당 면적형의 첫 거래입니다.</p>
            <p>해제 신고된 거래는 제외하며, 신고 시점에 따라 결과가 추후 변경될 수 있습니다.</p>
            <p>자료: 국토교통부 실거래가 공개시스템 · 매주 월·목 오전 자동 갱신</p>
        </footer>
    </section>

    <script src="app.js?v=4"></script>
</body>
</html>
